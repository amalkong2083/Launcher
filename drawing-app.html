<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Drawing App</title>
		
		<!-- <link rel="stylesheet" href="/style.css"> -->
		<!-- font awesome icons
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />

		<link rel="stylesheet" href="./css/lib/fontawesome-free-6.7.2-web/css/all.min.css" />
		<style>
			*{margin: 0;padding: 0;transition: none;-webkit-font-smoothing: antialised;-moz-osx-font-smoothing: grayscale;}
			*, *::before, *::after {box-sizing: border-box;}
			body {
				display: flex;
				align-items: center;
				justify-content: center;
				gap: 0.5rem;
				min-height: 100vh;
				background-color: #e3dede;
				margin: 0;
				padding: 0;
				box-sizing: border-box;
				font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
			}

			.drawing-app-container {
				display: flex;
				gap: 10px;
				height: 600px;
				height: max-content;
				max-width: 1050px;
				width: 100%;
				border-radius: 20px;
				border: 2px solid yellow;
			}
				
			.tools-board {
				width: 210px;
				height: 590px;
				border-radius: 20px;
				background-color: #f8f7f6;
				padding: 15px 22px 0;
			}
				
			.tools-board .row {
				margin-bottom: 20px;
			}
				
			.row .options {
				list-style: none;
				margin: 10px 0 0 5px;
			}
				
			.row .options .option {
				display: flex;
				cursor: pointer;
				align-items: center;
				margin-bottom: 10px;
			}
				
			.option:is(:hover, .active) img {
				filter: grayscale(20%);
			}
				
			.option :where(span, label) {
				color: black;
				cursor: pointer;
				padding-left: 10px;
			}
				
			.option:is(:hover, .active) :where(span, label) {
				color: #f4130b;
			}
				
			.option #fill-color {
				height: 14px;
				cursor: pointer;
				width: 14px;
			}
				
			#fill-color:checked~label {
				color: #e93e2b;
			}
				
			.option #size-slider {
				width: 100%;
				height: 5px;
				margin-top: 10px;
			}
				
			.colors .options {
				display: flex;
				justify-content: space-between;
			}
				
			.colors .option {
				height: 20px;
				width: 20px;
				border-radius: 30%;
				margin-top: 3px;
				position: relative;
			}
				
			.colors .option:nth-child(1) {
				background-color: #fff;
				border: 1px solid #bfbfbf;
			}
				
			.colors .option:nth-child(2) {
				background-color: black;
			}
				
			.colors .option:nth-child(3) {
				background-color: #ef4415;
			}
				
			.colors .option:nth-child(4) {
				background-color: green;
			}
				
			.colors .option:nth-child(5) {
				background-color: #c1f40a;
			}
				
			.colors .option.selected::before {
				position: absolute;
				content: "";
				height: 12px;
				top: 50%;
				left: 50%;
				width: 12px;
				background: inherit;
				border-radius: inherit;
				border: 2px solid #fff;
				transform: translate(-50%, -50%);
			}
				
			.colors .option:first-child.selected::before {
				border-color: #ccc;
			}
				
			.option #color-picker {
				opacity: 0;
				cursor: pointer;
			}
				
			.buttons button {
				width: 80%;
				color: #fff;
				border: none;
				outline: none;
				font-size: 0.9rem;
				padding: 3px 0;
				margin-bottom: 13px;
				background: none;
				border-radius: 5px;
				cursor: pointer;
			}
				
			.buttons .clear-canvas {
				color: black;
				border: 1px solid #9fc39f;
				transition: all 0.2s ease;
				border: 2px solid black;
				font-size: 13px;
			}
				
			.clear-canvas:hover {
				color: #fff;
				background: #6c757d;
			}
				
			.buttons .save-img {
				background: white;
				color: black;
				border: 1px solid #6c757d;
			}
				
			.drawing-board {
				flex: 1;
			}
				
			.drawing-board canvas {
				/*width: 100%;
				height: 100%;
				height: 590px;*/
				border-radius: 10px;
			}
			
			*{margin: 0;padding: 0;transition: none;-webkit-font-smoothing: antialised;-moz-osx-font-smoothing: grayscale;}
			*, *::before, *::after {box-sizing: border-box;}
			html, body {width: 100%;height: 100%;
				/* Prevent document pinch-zoom & touch-hold-to-highlight */
				touch-action: none;
				
				-webkit-touch-callout: none;
				/* iOS Safari */
				-webkit-user-select: none;
				/* Safari */
				-khtml-user-select: none;
				/* Konqueror HTML */
				-moz-user-select: none;
				/* Old versions of Firefox */
				-ms-user-select: none;
				/* Internet Explorer/Edge */
				user-select: none;
				/* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox */
			}
			body {display: flex;align-items: center;justify-content: center;gap: 0.5rem;min-height: 100vh;width: 100vw;background-color: #e3dede;font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;}
			.drawing-app-container {position: relative;display: flex;gap: 0px;height: 100%;max-width: 1050px;width: 100%;/*border: 2px solid yellow;*/}
			.tools-board {z-index: 2;position: absolute;width: 210px;height: 100%;border-radius: 20px;background-color: #f8f7f6;padding: 15px 22px 0;translate: -100% 0;opacity: 0.6;transition: all ease 0.5s;}
			.tools-board.--active {translate: 0 0;}
			.tools-board:hover{opacity: 1;}
			.tools-board .row {margin-bottom: 1.25rem;backdrop-filter: blur(5px);}
			.row .options {list-style: none;margin: 10px 0 0 5px;}
			.row .options .option {display: flex;cursor: pointer;align-items: center;margin-bottom: 10px;}
			.option:is(:hover, .active) img {filter: grayscale(20%);}
			.option :where(span, label) {color: black;cursor: pointer;padding-left: 10px;}
			.option:is(:hover, .active) :where(span, label) {color: #f4130b;}
			.option #fill-color {height: 14px;cursor: pointer;width: 14px;}
			#fill-color:checked~label {color: #e93e2b;}
			.option #size-slider {width: 100%;height: 5px;margin-top: 10px;}
			.colors .options {display: flex;justify-content: space-between;}
			.colors .option {height: 20px;width: 20px;border-radius: 30%;margin-top: 3px;position: relative;}
			.colors .option:nth-child(1) {background-color: #fff;border: 1px solid #bfbfbf;}
			.colors .option:nth-child(2) {background-color: black;}
			.colors .option:nth-child(3) {background-color: #ef4415;}
			.colors .option:nth-child(4) {background-color: green;}
			.colors .option:nth-child(5) {background-color: #c1f40a;}
			.colors .option.selected::before {position: absolute;content: "";height: 12px;top: 50%;left: 50%;width: 12px;background: inherit;border-radius: inherit;border: 2px solid #fff;transform: translate(-50%, -50%);}
			.colors .option:first-child.selected::before {border-color: #ccc;}
			.option #color-picker {opacity: 0;cursor: pointer;}
			.buttons button {width: 80%;color: #fff;border: none;outline: none;font-size: 0.9rem;padding: 3px 0;margin-bottom: 13px;background: none;border-radius: 5px;cursor: pointer;}
			.buttons .clear-canvas {color: black;border: 1px solid #9fc39f;transition: all 0.2s ease;border: 2px solid black;font-size: 13px;}
			.clear-canvas:hover {color: #fff;background: #6c757d;}
			.buttons .save-img {background: white;color: black;border: 1px solid #6c757d;}	
			.drawing-board {flex: 1;}
			.drawing-board canvas {
				/*width: 100%;
				height: 100%;
				height: 590px;*/
				border-radius: 10px;
			}
		 </style>
	</head>
	<body>
		<div class="drawing-app-container">
			<section class="tools-board">
				<div class="row">
					<label for="" class="title"><strong>Tools</strong></label>
					<ul class="options">
						<li class="option tool" id="pencil">
							<i class="fas fa-pencil" id="icon"></i>
							<span>Pencil</span>
						</li>
						<li class="option active tool" id="brush">
							<i class="fas fa-brush" id="icon"></i>
							<span>Brush</span>
						</li>
						<li class="option tool" id="eraser">
							<i class="fas fa-eraser" id="icon"></i>
							<span>Eraser</span>
						</li>
						<li class="option">
							<input type="range" id="size-slider" min="1" max="30" value="5">
						</li>
					</ul>
				</div>
				<div class="row colors">
					<label for="" class="title">Colors</label>
					<ul class="options">
						<li class="option"></li>
						<li class="option selected"></li>
						<li class="option"></li>
						<li class="option"></li>
						<li class="option">
							<input type="color" value="#00FF00" name="" id="color-picker">
						</li>
					</ul>
				</div>
				
				<div class="row">
					<label for="" class="title"> <strong>Shapes</strong></label>
					<ul class="options">
						<li class="option tool" id="rectangle">
							<i class="fa-solid fa-dice-one"></i>
							<span>Rectangle</span>
						</li>
						<li class="option tool" id="circle">
							<i class="fa-regular fa-circle"></i>
							<span>Circle</span>
						</li>
						<li class="option tool" id="triangle">
							<i class="fa-solid fa-mountain"></i>
							<span>Triangle</span>
						</li>
						<li class="option tool" id="square">
							<i class="far fa-square"></i>
							<span>Square</span>
						</li>
						<li class="option tool" id="hexagon">
							<i class="fa-solid fa-cube"></i>
							<span>Hexagon</span>
						</li>
						<li class="option tool" id="pentagon">
							<i class="fa-solid fa-dice-d6"></i>
							<span>Pentagon</span>
						</li>
						<li class="option tool" id="line">
							<i class="fa-solid fa-grip-lines"></i>
							<span>Line</span>
						</li>
						<li class="option tool" id="arrow">
							<i class="fa-solid fa-arrow-up"></i>
							<span>Arrow</span>
						</li>
						<li class="option">
							<input type="checkbox" id="fill-color">
							<label for="fill-color"> Fill Color</label>
						</li>
					</ul>
				</div>
				<div class="row buttons">
					<button class="clear-canvas">Clear Canvas</button>
					<button class="save-img">Save As Image</button>
				</div>
			</section>
			<section class="drawing-board" style="border: 2px solid #f00;">
				<canvas></canvas>
			</section>
		</div>
		<script>
			let hasDocument = ('undefined' !== typeof document), hasWindow = ('undefined' !== typeof window), nonce = Date.now();
			let isTouch = hasDocument && document.ontouchstart ? true : false;
			isTouch = true;
			const clickEvent = isTouch === true ? 'touchstart' : 'click';
			console.log(isTouch, clickEvent)
			
			const toolBtns = document.querySelectorAll(".tool"),
			fillColor = document.querySelector("#fill-color"),
			sizeSlider = document.querySelector("#size-slider"),
			colorBtns = document.querySelectorAll(".colors .option"),
			colorPicker = document.querySelector("#color-picker"),
			cleatCanvas = document.querySelector(".clear-canvas"),
			saveImage =  document.querySelector(".save-img"),
			canvas = document.querySelector("canvas"),
			ctx = canvas.getContext("2d");
			
			//global variabels wiht default values
			let prevMouseX, prevMouseY, snapshot,
				isDrawing = false,
				selectedTool = "brush",
				brushWidth = 5,
				selectedColor = "#000";

			const setCanvasBackground = () => {
				ctx.fillStyle = "#fff";
				ctx.fillRect(0, 0, canvas.width, canvas.height);
				ctx.fillStyle = selectedColor;
			}
			
			window.addEventListener("load", () => {
				// Setting canvas widht/height.. 
				// offsetwidht/height returns 
				// viewbale widht/height of an element
				
				canvas.width = canvas.parentElement.offsetWidth || canvas.offsetWidth;
				canvas.height = canvas.parentElement.offsetHeight || canvas.offsetHeight;
				// canvas.width = 350;
				// canvas.height = 450;
				setCanvasBackground();
			});
			
			const drawRect = (e) => {
				//e = isTouch === true ? e.touches[0] : e;
				// If fillColor isn't checked draw a react wiht 
				// border else draw rect wiht backgorund
				if(!fillColor.checked) {
				    const width = prevMouseX - e.offsetX;
				    const height = prevMouseY - e.offsetY;
				    return ctx.strokeRect(e.offsetX, e.offsetY,
				    width, height);
			    }
				const width = prevMouseX - e.offsetX;
				const height = prevMouseY - e.offsetY;
				ctx.fillRect(e.offsetX, e.offsetY, width, height);
			}
			
			const drawCircle = (e) => {
				//e = isTouch === true ? e.touches[0] : e;
				ctx.beginPath();
				let radius = Math.sqrt(Math.pow((prevMouseX - e.offsetX), 2) + Math.pow((prevMouseY - e.offsetY), 2));
				ctx.arc(prevMouseX, prevMouseY, radius, 0, 2 * Math.PI);
				fillColor.checked ? ctx.fill() : ctx.stroke();
			}
			
			const drawTriangle = (e) => {
				//e = isTouch === true ? e.touches[0] : e;
				ctx.beginPath(); 
				ctx.moveTo(prevMouseX, prevMouseY);
				ctx.lineTo(e.offsetX, e.offsetY); 
				ctx.lineTo(prevMouseX * 2 - e.offsetX, e.offsetY); 
				ctx.closePath(); 
				fillColor.checked ? ctx.fill() : ctx.stroke();
			}
			
			// Function to draw a square
			const drawSquare = (e) => {
				//e = isTouch === true ? e.touches[0] : e;
				const sideLength = Math.abs(prevMouseX - e.offsetX);
				ctx.beginPath();
				ctx.rect(e.offsetX, e.offsetY, sideLength, sideLength);
				fillColor.checked ? ctx.fill() : ctx.stroke();
			}
	
			// Function to draw a hexagon
			const drawHexagon = (e) => {
				//e = isTouch === true ? e.touches[0] : e;
				const sideLength = Math.abs(prevMouseX - e.offsetX);
				ctx.beginPath();
				for (let i = 0; i < 6; i++) {
					const angle = (2 * Math.PI / 6) * i;
					const x = e.offsetX + sideLength * Math.cos(angle);
					const y = e.offsetY + sideLength * Math.sin(angle);
					ctx.lineTo(x, y);
				}
				ctx.closePath();
				fillColor.checked ? ctx.fill() : ctx.stroke();
			}
	
			// Function to draw a pentagon
			const drawPentagon = (e) => {
				//e = isTouch === true ? e.touches[0] : e;
				const sideLength = Math.abs(prevMouseX - e.offsetX);
				ctx.beginPath();
				for (let i = 0; i < 5; i++) {
					const angle = (2 * Math.PI / 5) * i - Math.PI / 2;
					const x = e.offsetX + sideLength * Math.cos(angle);
					const y = e.offsetY + sideLength * Math.sin(angle);
					ctx.lineTo(x, y);
				}
				ctx.closePath();
				fillColor.checked ? ctx.fill() : ctx.stroke();
			}
			
			const drawLine = (e) => {
				//e = isTouch === true ? e.touches[0] : e;
				ctx.beginPath();
				ctx.moveTo(prevMouseX, prevMouseY);
				ctx.lineTo(e.offsetX, e.offsetY);
				ctx.stroke();
			}
			
			const drawArrow = (e) => {
				//e = isTouch === true ? e.touches[0] : e;
				const headLength = 10;
				const angle = Math.atan2(e.offsetY - prevMouseY, e.offsetX - prevMouseX);
				ctx.beginPath();
				ctx.moveTo(prevMouseX, prevMouseY);
				ctx.lineTo(e.offsetX, e.offsetY);
				ctx.stroke();
				
				// Draw arrowhead
				ctx.beginPath();
				ctx.moveTo(e.offsetX - headLength * Math.cos(angle - Math.PI / 6), e.offsetY - headLength * Math.sin(angle - Math.PI / 6));
				ctx.lineTo(e.offsetX, e.offsetY);
				ctx.lineTo(e.offsetX - headLength * Math.cos(angle + Math.PI / 6), e.offsetY - headLength * Math.sin(angle + Math.PI / 6));
				ctx.closePath();
				ctx.fill();
			}
			
			const startDraw = (e) => {
				//e = isTouch === true ? e.touches[0] : e;
				if(isTouch === true && e.touches) {
					e = e.touches[0];
					e.offsetX = e.offsetX || e.pageX;
					e.offsetY = e.offsetY || e.pageY;
				}
				isDrawing = true;
				prevMouseX = e.offsetX; 
				prevMouseY = e.offsetY;
				ctx.beginPath();
				ctx.lineWidth = brushWidth;
				ctx.strokeStyle = selectedColor;
				ctx.fillStyle = selectedColor;
				snapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
				console.log(prevMouseX, prevMouseY, e)
			}
			
			const drawPencil = (e) => {
				// e = isTouch === true ? e.touches[0] : e;
				ctx.lineTo(e.offsetX, e.offsetY);
				ctx.stroke();
			}
			
			const drawing = (e) => {
				//e = isTouch === true ? e.touches[0] : e;
				if(isTouch === true && e.touches) {
					e = e.touches[0];
					e.offsetX = e.offsetX || e.pageX;
					e.offsetY = e.offsetY || e.pageY;
				}
				if(!isDrawing) return;
				ctx.putImageData(snapshot, 0, 0);
				
				if (selectedTool === "brush" && selectedTool === "pencil" || selectedTool === "eraser") {
					ctx.strokeStyle = selectedTool === "eraser" ? "#fff" : selectedColor;
					ctx.lineTo(e.offsetX, e.offsetY);
					ctx.stroke();
				} else if (selectedTool === "rectangle") {
					drawRect(e);
				} else if (selectedTool === "circle") {
					drawCircle(e);
				} else if (selectedTool === "triangle") {
					drawTriangle(e);
				} else if (selectedTool === "square") {
					drawSquare(e);
				} else if (selectedTool === "hexagon") {
					drawHexagon(e);
				} else if (selectedTool === "pentagon") {
					drawPentagon(e);
				} else if (selectedTool === "line") {
					drawLine(e);
				} else if (selectedTool === "arrow") {
					drawArrow(e);
				} else if (selectedTool === "curve") {
					drawCurve(e);
				} else {
					drawPencil(e);
				}
				// console.log(prevMouseX, prevMouseY)
			}
			
			toolBtns.forEach(btn => {
				btn.addEventListener("click", () => {
					document.querySelector(".options .active").classList.remove("active");
					btn.classList.add("active");
					selectedTool = btn.id;
					console.log(selectedTool);
				});
			});
			
			sizeSlider.addEventListener("change", () => brushWidth = sizeSlider.value);
			
			colorBtns.forEach(btn => {
				btn.addEventListener("click", () => {
					document.querySelector(".options .selected").classList.remove("selected");
					btn.classList.add("selected");
					selectedColor = window.getComputedStyle(btn).getPropertyValue("background-color");
				});
			});
			
			colorPicker.addEventListener("change", () => {
				colorPicker.parentElement.style.background = colorPicker.value;
				colorPicker.parentElement.click();
			});
				
			cleatCanvas.addEventListener("click", () => {
				ctx.clearRect(0, 0, canvas.width, canvas.height)
				setCanvasBackground();
			});
				
			saveImage.addEventListener("click", () => {
				const link = document.createElement("a");
				link.download = `${Date.now()}`.jpg;
				link.href = canvas.toDataURL();
				link.click();
			});
				
			canvas.addEventListener("mousedown", startDraw);
			canvas.addEventListener("mousemove", drawing);
			canvas.addEventListener("mouseup", () => isDrawing = false);
			
			canvas.addEventListener("touchstart", startDraw);
			canvas.addEventListener("touchmove", drawing);
			canvas.addEventListener("touchend", () => isDrawing = false);
			
			document.body.addEventListener("dblclick", function(e){
	document.querySelector(".tools-board").classList.toggle("--active");
});
		</script>
	</body>
</html>
